<div class="entry-list">{{ range .Params.education }}<article class="experience-entry"><p class="entry-date">{{ time.Format "2006" .date_start }}–{{ if .date_end }}{{ time.Format "2006" .date_end }}{{ else }}Present{{ end }}</p><h4>{{ .degree }}</h4><p class="entry-institution">{{ .institution }}</p>{{ with .supervisor }}<p class="entry-detail">Supervisor: {{ . }}</p>{{ end }}{{ with .summary }}<div class="entry-summary">{{ . | markdownify }}</div>{{ end }}</article>{{ end }}</div>
