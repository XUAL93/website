{{ range .Params.education }}<article class="cv-row"><p class="cv-date">{{ time.Format "2006" .date_start }}–{{ if .date_end }}{{ time.Format "2006" .date_end }}{{ else }}Present{{ end }}</p><div class="cv-body"><h3>{{ .degree }}</h3><p class="cv-org">{{ .institution }}</p>{{ with .supervisor }}<p class="cv-meta">Supervisor: {{ . }}</p>{{ end }}{{ with .summary }}<div class="cv-summary">{{ . | markdownify }}</div>{{ end }}</div></article>{{ end }}
