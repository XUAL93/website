<div class="entry-list">{{ range .Params.work }}<article class="experience-entry"><p class="entry-date">{{ if .period }}{{ .period }}{{ else }}{{ time.Format "Jan 2006" .date_start }}–{{ if .date_end }}{{ time.Format "Jan 2006" .date_end }}{{ else }}Present{{ end }}{{ end }}</p><h4>{{ .position }}</h4><p class="entry-institution">{{ .company_name }}</p>{{ with .summary }}<div class="entry-summary">{{ . | markdownify }}</div>{{ end }}</article>{{ end }}</div>
